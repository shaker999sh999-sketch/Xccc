<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A2C1D">
<title>تم — خدمات المنزل بين يديك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#4A2C1D;--brown2:#6B4330;--amber:#D9A441;--bg:#EDEFEC;--card:#fff;--ink:#241A15;--mute:#7B6F68;--line:#E2DFDA;--green:#1E9E57;--red:#C62828;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Readex Pro',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brown2)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:14px}
small{font-size:.8em;color:var(--mute)}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.05rem;font-weight:600;margin-bottom:8px}
h2.sec{margin:20px 2px 8px}

/* splash */
#splash{position:fixed;inset:0;background:var(--brown);display:grid;place-items:center;z-index:100;transition:opacity .6s}
